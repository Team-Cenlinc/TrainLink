<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      地址栏颜色：面板灰（--canvas），iOS 26 的 Safari 不看它（状态栏颜色来自贴顶色条，见 lib/useTopColor.ts），
      给其他浏览器用。App 里选了外观时由 settings.ts 的 applyTheme 换。
    -->
    <meta name="theme-color" content="#F0F1F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111416" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      不写 apple-mobile-web-app-status-bar-style：从主屏打开时状态栏不压在页面上，颜色由 iOS 取页面顶上的
      贴顶色条（见 lib/useTopColor.ts），跟着每页、每个车站变，没有渐变，内容一直铺到屏幕底。
      写 black-translucent（Apple 已弃用）时 iOS 26/27 会在状态栏下面盖一层关不掉的渐变，
      屏幕最底下还有一截画不到（WebKit bug 317153、301108）。主屏图标要删掉重新添加才生效。
    -->
    <meta name="apple-mobile-web-app-title" content="TrainLink" />
    <meta
      name="description"
      content="TrainLink：Fetarute 铁路的实时发车与列车位置，规划换乘行程，随时掌握各线路运行状态。"
    />
    <title>TrainLink</title>
    <!--
      分享卡片（微信、Discord、X 等读取）：链接必须写绝对地址，正式站点是 trainlink.fetarute.info。
      分享图由 scripts/build-icons.ts 生成（1200×630）。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrainLink" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:url" content="https://trainlink.fetarute.info/" />
    <meta property="og:title" content="TrainLink" />
    <meta
      property="og:description"
      content="Fetarute 铁路的实时发车与列车位置，规划换乘行程，随时掌握各线路运行状态。"
    />
    <meta property="og:image" content="https://trainlink.fetarute.info/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TrainLink：下一班车，一眼看清" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TrainLink" />
    <meta
      name="twitter:description"
      content="Fetarute 铁路的实时发车与列车位置，规划换乘行程，随时掌握各线路运行状态。"
    />
    <meta name="twitter:image" content="https://trainlink.fetarute.info/og-image.png" />
    <!-- 图标由 scripts/build-icons.ts 生成（npm run icons）。 -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 暂用 Google Fonts；之后改为与官网一样自托管子集字体，以支持离线。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;700;900&display=swap"
    />
  </head>
  <body>
    <noscript>TrainLink 需要启用 JavaScript 才能使用。</noscript>
    <div id="top-edge" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
